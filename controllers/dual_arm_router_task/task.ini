; 唯一任務設定檔。座標單位：公尺；角度單位：弧度。
[task]
run_order = ["port_a","port_b"]
port_a = [0.60, 0.08, 0.30]
port_b = [0.60, -0.08, 0.30]

[calibration]
pickup_tip = [0.34, 0.33, 0.034]
installed_tip = [0.589, 0.08, 0.297]
insertion_tip = [0.600, 0.08, 0.300]
place_tip = [0.34, 0.33, 0.022]
closed_angle = 0.7

[control]
time_step_ms = 32
max_joint_speed = 2.5
gripper_close_speed = 0.5
gripper_open_speed = 0.8
grip_history_samples = 20
max_finger_range = 0.015
min_contact_angle = 0.05
contact_angle_margin = 0.03
